name: Release verified Nose Review runtime
on:
  schedule:
    - cron: '37 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nose-runtime-update
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require private distribution access
        env:
          NOSE_RELEASE_TOKEN: ${{ secrets.NOSE_RELEASE_TOKEN }}
        run: |
          if [ -z "$NOSE_RELEASE_TOKEN" ]; then
            echo '::error::Set NOSE_RELEASE_TOKEN to a fine-grained token with read-only Contents access to qkrwndnjs1075/nose.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/update-nose-runtime.test.mjs scripts/publish-nose-plugin.test.mjs
      - run: node scripts/update-nose-runtime.mjs
        env:
          GH_TOKEN: ${{ secrets.NOSE_RELEASE_TOKEN }}
      - name: Select pending plugin release
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/publish-nose-plugin.mjs pending
      - name: Verify downloaded runtime
        if: steps.pending.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.NOSE_RELEASE_TOKEN }}
        run: |
          node scripts/smoke-nose-runtime.mjs
      - name: Prepare regression tools
        if: steps.pending.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools="$RUNNER_TEMP/nose-review-tools"
          mkdir -p "$tools"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --pattern gitleaks_8.30.1_checksums.txt --dir "$tools"
          (cd "$tools" && sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt)
          tar -xzf "$tools/gitleaks_8.30.1_linux_x64.tar.gz" -C "$tools" gitleaks
          echo "$tools" >> "$GITHUB_PATH"
          node --input-type=module -e 'import {dirname} from "node:path"; import {resolveNose} from "./plugins/nose-review/scripts/nose-runtime.mjs"; console.log(dirname(resolveNose()));' >> "$GITHUB_PATH"
          "$tools/gitleaks" version
          git --version
      - name: Run Nose Review regressions
        if: steps.pending.outputs.release == 'true'
        run: node --test plugins/nose-review/scripts/*.test.mjs
      - name: Publish verified plugin
        if: steps.pending.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          runtime=$(node -p 'JSON.parse(require("fs").readFileSync("plugins/nose-review/scripts/nose-runtime.json")).version')
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add plugins/nose-review/scripts/nose-runtime.json plugins/nose-review/.codex-plugin/plugin.json
            git diff --exit-code
            git commit -m "chore(nose-review): release runtime ${runtime}"
            gh auth setup-git
            git push origin HEAD:main
          fi
          node scripts/publish-nose-plugin.mjs publish
