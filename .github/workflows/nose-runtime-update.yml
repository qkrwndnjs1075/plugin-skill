name: Propose verified Nose runtime update
on:
  schedule:
    - cron: '37 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: nose-runtime-update
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Require private distribution access
        env:
          NOSE_RELEASE_TOKEN: ${{ secrets.NOSE_RELEASE_TOKEN }}
        run: |
          if [ -z "$NOSE_RELEASE_TOKEN" ]; then
            echo '::error::Set NOSE_RELEASE_TOKEN to a fine-grained token with read-only Contents access to qkrwndnjs1075/nose.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/update-nose-runtime.test.mjs
      - run: node scripts/update-nose-runtime.mjs
        env:
          GH_TOKEN: ${{ secrets.NOSE_RELEASE_TOKEN }}
      - name: Verify downloaded runtime
        env:
          GH_TOKEN: ${{ secrets.NOSE_RELEASE_TOKEN }}
        run: |
          node scripts/smoke-nose-runtime.mjs
          node --test plugins/nose-review/scripts/nose-runtime.test.mjs
      - name: Propose pin update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then exit 0; fi
          version=$(node -p 'JSON.parse(require("fs").readFileSync("plugins/nose-review/scripts/nose-runtime.json")).version')
          branch="automation/nose-runtime-${version}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Update branch already exists; keeping review intact."
          else
            git switch -c "$branch"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add plugins/nose-review/scripts/nose-runtime.json plugins/nose-review/.codex-plugin/plugin.json
            git commit -m "chore(nose-review): propose runtime ${version}"
            git push origin "$branch"
          fi
          if [ "$(gh pr list --head "$branch" --state all --json number --jq length)" = 0 ]; then
            gh pr create --base main --head "$branch" --title "Update Nose runtime to ${version}" --body 'Updates the pinned runtime from our independent distribution. All platform archives match their release checksums; the Linux runtime installation and clean/duplicate CLI smoke tests passed. Review integration compatibility before merging. No automatic merge.'
          fi
